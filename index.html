<!DOCTYPE html>
<html lang="be">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>
    Жывы верш — Максім Багдановіч
  </title>


  <!-- MindAR -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>


  <!-- A-Frame -->

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- MindAR + A-Frame -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        sans-serif;

      background: #000;
    }


    #start {

      position: fixed;

      z-index: 100;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width: 85%;

      max-width: 400px;

      padding: 30px 20px;

      box-sizing: border-box;

      text-align: center;

      background:
        rgba(255,255,255,0.95);

      border-radius: 20px;

      box-shadow:
        0 5px 30px
        rgba(0,0,0,0.3);
    }


    #start h1 {

      margin-top: 0;

      font-size: 27px;

      color: #333;
    }


    #start p {

      font-size: 17px;

      line-height: 1.5;

      color: #555;
    }


    #start button {

      padding: 14px 30px;

      border: none;

      border-radius: 30px;

      background: #333;

      color: white;

      font-size: 17px;

      cursor: pointer;
    }


    #poem {

      position: fixed;

      z-index: 50;

      left: 5%;
      right: 5%;

      bottom: 30px;

      text-align: center;

      color: white;

      font-size: 21px;

      line-height: 1.5;

      text-shadow:
        0 2px 5px #000,
        0 0 10px #000;

      opacity: 0;

      transition:
        opacity 1.5s ease;

      pointer-events: none;
    }


    #poem.show {

      opacity: 1;
    }

  </style>

</head>


<body>


  <!-- Уступ -->

  <div id="start">

    <h1>
      🦋 ЖЫВЫ ВЕРШ
    </h1>

    <p>
      Максім Багдановіч
    </p>

    <p>
      Навядзіце камеру на
      выяву матылька.
    </p>

    <button id="startButton">

      АЖЫВІЦЬ ВЕРШ

    </button>

  </div>


  <!-- Тэкст -->

  <div id="poem">

    Па-над белым пухам вішняў...

  </div>


  <!-- AR -->

  <a-scene

    mindar-image="
      imageTargetSrc:
      ./targets.mind;

      autoStart: false;

      uiLoading: no;

      uiScanning: no;

      uiError: no;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights
    "

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    ">


    <!-- Камера -->

    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      "

      cursor="
        fuse: false;
        rayOrigin: mouse;
      "

      raycaster="
        far: 10000;
        objects: .clickable;
      ">

    </a-camera>


    <!-- AR-маркер -->

    <a-entity
      mindar-image-target="
        targetIndex: 0
      ">


      <!-- Матылёк -->

      <a-image

        src="./butterfly.png"

        position="
          0
          0.20
          0
        "

        width="0.8"

        height="0.8"

        animation__float="

          property: position;

          from: 0 0.20 0;

          to: 0 0.32 0;

          dur: 1800;

          easing:
            easeInOutSine;

          loop: true;

          dir: alternate;
        "

        animation__scale="

          property: scale;

          from:
            0.75
            0.75
            0.75;

          to:
            1
            1
            1;

          dur: 1000;

          easing:
            easeOutElastic;

          loop: false;
        ">

      </a-image>


      <!-- Вішнёвая галінка -->

      <a-image

        src="./branch.png"

        position="
          0
          -0.45
          0
        "

        width="1.8"

        height="0.7"

        animation="

          property: rotation;

          from:
            0
            0
            -2;

          to:
            0
            0
            2;

          dur: 2500;

          easing:
            easeInOutSine;

          loop: true;

          dir: alternate;
        ">

      </a-image>


    </a-entity>


  </a-scene>


  <!-- Музыка -->

  <audio
    id="music"
    src="./music.mp3"
    preload="auto">
  </audio>


  <script>


    const scene =
      document.querySelector(
        "a-scene"
      );


    const target =
      document.querySelector(
        "[mindar-image-target]"
      );


    const start =
      document.getElementById(
        "start"
      );


    const button =
      document.getElementById(
        "startButton"
      );


    const poem =
      document.getElementById(
        "poem"
      );


    const music =
      document.getElementById(
        "music"
      );


    /*
      Запуск AR
    */

    button.addEventListener(
      "click",

      async function () {

        start.style.display =
          "none";


        const mindarSystem =
          scene.systems[
            "mindar-image-system"
          ];


        try {

          await mindarSystem.start();

        }

        catch (error) {

          console.error(error);

          alert(
            "Не атрымалася запусціць камеру."
          );

        }

      }
    );


    /*
      Маркер знойдзены
    */

    target.addEventListener(

      "targetFound",

      function () {

        console.log(
          "AR-маркер знойдзены"
        );


        poem.classList.add(
          "show"
        );


        /*
          Запуск аўдыё
        */

        music.currentTime = 0;

        music.play().catch(
          function(error) {

            console.log("Аўдыё патрабуе дадатковага націску.");

          }
        );

      }

    );


    /*
      Маркер знік
    */

    target.addEventListener(

      "targetLost",

      function () {

        poem.classList.remove(
          "show"
        );

        music.pause();

      }

    );


  </script>
</body>
</html>
