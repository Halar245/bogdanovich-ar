<!DOCTYPE html>
<html lang="be">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ЖЫВЫ ВЕРШ — Маёвая песня</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>

  <!-- MindAR + A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #start {
      position: fixed;
      z-index: 1000;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      background: rgba(0, 0, 0, 0.88);

      color: white;
    }

    #start h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    #start p {
      font-size: 17px;
      max-width: 320px;
      line-height: 1.5;
    }

    #startButton {
      margin-top: 20px;

      padding: 15px 30px;

      font-size: 18px;

      border: none;
      border-radius: 10px;

      background: #ffffff;
      color: #222;

      cursor: pointer;
    }

    #poem {
      position: fixed;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      width: 85%;
      max-width: 500px;

      padding: 18px;

      box-sizing: border-box;

      background: rgba(255, 255, 255, 0.92);

      border-radius: 15px;

      text-align: center;

      font-size: 18px;
      line-height: 1.5;

      opacity: 0;

      transition: opacity 0.7s;

      z-index: 900;
    }

    #poem.show {
      opacity: 1;
    }

  </style>

</head>


<body>

  <!-- Стартавае акно -->

  <div id="start">

    <h1>🦋 ЖЫВЫ ВЕРШ</h1>

    <p>
      Навядзіце камеру смартфона
      на выяву матылька.
    </p>

    <button id="startButton">
      Пачаць AR
    </button>

  </div>


  <!-- Тэкст верша -->

  <div id="poem">

    <strong>Маёвая песня</strong>

    <br><br>

    Па-над белым пухам вішняў...

    <br><br>

    <em>
      Максім Багдановіч
    </em>

  </div>


  <!-- AR -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- Камера -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

      cursor="fuse: false; rayOrigin: mouse"

      raycaster="far: 10000; objects: .clickable"

    ></a-camera>


    <!-- AR-маркер -->

    <a-entity

      mindar-image-target="targetIndex: 0"
    >


      <!-- Матылёк -->

      <a-image

        src="./butterfly.png"

        position="0 0.25 0"

        width="1"

        height="0.7"

        animation__float="
          property: position;
          from: 0 0.25 0;
          to: 0 0.35 0;
          dur: 1800;
          easing: easeInOutSine;
          loop: true;
          dir: alternate;
        "

        animation__scale="
          property: scale;
          from: 1 1 1;
          to: 1.08 1.08 1.08;
          dur: 1800;
          easing: easeInOutSine;
          loop: true;
          dir: alternate;
        "

      ></a-image>


      <!-- Вішнёвая галінка -->

      <a-image

        src="./branch.png"

        position="0 -0.35 0"

        width="1.8"

        height="0.7"

        animation="
          property: rotation;
          from: 0 0 -2;
          to: 0 0 2;
          dur: 2500;
          easing: easeInOutSine;
          loop: true;
          dir: alternate;
        "

      ></a-image>


    </a-entity>

  </a-scene>


  <!-- Музыка -->

  <audio

    id="music"

    src="./music.mp3"

    preload="auto"

  ></audio>


  <script>

    const scene =
      document.querySelector("a-scene");


    const target =
      document.querySelector(
        "[mindar-image-target]"
      );


    const start =
      document.getElementById("start");


    const button =
      document.getElementById("startButton");


    const poem =
      document.getElementById("poem");


    const music =
      document.getElementById("music");


    /*
      Запуск AR
    */

    button.addEventListener(
      "click",

      async function () {

        try {

          const mindarSystem =
            scene.systems["mindar-image-system"];


          await mindarSystem.start();


          start.style.display = "none";


          console.log(
            "AR запушчаны"
          );

        }

        catch (error) {

          console.error(
            "Памылка камеры:",
            error
          );


          alert(
            "Не атрымалася запусціць камеру. Праверце дазвол камеры ў браўзеры."
          );

        }

      }

    );


    /*
      Маркер знойдзены
    */

    target.addEventListener(

      "targetFound",

      function () {

        console.log(
          "AR-маркер знойдзены"
        );


        poem.classList.add(
          "show"
        );


        /*
          Запуск аўдыё
        */

        music.currentTime = 0;


        music.play().catch(

          function (error) {

            console.log(
              "Аўдыё патрабуе дадатковага націску."
            );

          }

        );

      }

    );


    /*
      Маркер знік
    */

    target.addEventListener(

      "targetLost",

      function () {

        console.log(
          "AR-маркер страчаны"
        );


        poem.classList.remove(
          "show"
        );


        music.pause();

      }

    );

  </script>


</body>

</html>


  </script>
</body>
</html>
